name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Also builds the CLI through its `prepare` script.
      - run: npm ci

      # Nothing here calls a model, so the OpenRouter key is a placeholder and
      # the auth secret is thrown away with the runner.
      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=file:./data/app.db"
            echo "OPENROUTER_API_KEY=sk-or-v1-ci-placeholder"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
          } > .env

      - run: npm run lint

      - run: npm test

      - run: npm run db:migrate

      # `prebuild` also bundles the MCP App views the e2e server serves.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts skips *.llm.spec.ts unless E2E_LLM is set; the
      # html reporter is added here so a failure leaves something to upload.
      - run: npx playwright test --reporter=list,html

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
